<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- Social Media Profile Avatar 800x800 (Circular Friendly) -->
  <defs>
    <radialGradient id="socBg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1A5243"/>
      <stop offset="60%" stop-color="#123D32"/>
      <stop offset="100%" stop-color="#0B261F"/>
    </radialGradient>
    <linearGradient id="socFlow" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#16A572"/>
      <stop offset="50%" stop-color="#1CD291"/>
      <stop offset="100%" stop-color="#FFCC45"/>
    </linearGradient>
    <filter id="socGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#16A572" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="800" height="800" fill="url(#socBg)"/>

  <!-- Centered Circular Safe Area Guides -->
  <circle cx="400" cy="400" r="380" fill="none" stroke="#16A572" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Center Symbol & Brand Stack -->
  <g transform="translate(400, 370)" text-anchor="middle">
    <!-- Emblem -->
    <g transform="translate(-160, -220) scale(1.15)" filter="url(#socGlow)">
      <rect width="280" height="280" rx="64" fill="#17211D" stroke="#16A572" stroke-width="3"/>
      <circle cx="68" cy="210" r="14" fill="#16A572"/>
      <circle cx="68" cy="210" r="6" fill="#F8F9F6"/>
      <path d="M 68 210 C 68 165 130 150 150 120 C 170 90 165 60 135 48 C 110 38 75 55 78 85 L 42 80 C 35 32 90 8 145 16 C 200 24 212 75 180 115 C 150 150 110 155 100 180 C 92 200 105 212 125 212 C 155 212 178 190 200 162 L 225 182 C 195 225 160 245 115 245 C 68 245 45 225 68 210 Z" fill="url(#socFlow)"/>
      <path d="M 160 26 L 222 18 L 214 80 L 192 58 L 152 98 L 130 76 L 170 36 Z" fill="#FFCC45"/>
      <circle cx="214" cy="26" r="6" fill="#123D32"/>
    </g>

    <!-- Wordmark -->
    <text x="0" y="180" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="52" font-weight="900" fill="#F8F9F6" letter-spacing="8">
      SIMBORA
    </text>

    <!-- Regional Tag -->
    <text x="0" y="225" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFCC45" letter-spacing="3">
      ALAGOAS • BRASIL
    </text>
  </g>
</svg>
