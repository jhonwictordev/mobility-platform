<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 160" width="100%" height="100%">
  <defs>
    <!-- Kinetic Gradients -->
    <linearGradient id="simboraSymbolGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#123D32"/>
      <stop offset="55%" stop-color="#16A572"/>
      <stop offset="100%" stop-color="#FFCC45"/>
    </linearGradient>

    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCC45"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <filter id="logoElevation" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#123D32" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="620" height="160" rx="24" fill="#F8F9F6"/>

  <g transform="translate(32, 22)">
    <!-- 1. SÍMBOLO INTEGRADO (S dinâmico em fita com seta solar) -->
    <g transform="translate(0, 0) scale(0.38)" filter="url(#logoElevation)">
      <!-- Background icon circle -->
      <rect width="280" height="280" rx="64" fill="#123D32"/>
      
      <!-- Waypoint de partida (Piaçabuçu) -->
      <circle cx="68" cy="210" r="14" fill="#16A572"/>
      <circle cx="68" cy="210" r="6" fill="#F8F9F6"/>

      <!-- Traçado do S cinético -->
      <path d="M 68 210 C 68 165 130 150 150 120 C 170 90 165 60 135 48 C 110 38 75 55 78 85 L 42 80 C 35 32 90 8 145 16 C 200 24 212 75 180 115 C 150 150 110 155 100 180 C 92 200 105 212 125 212 C 155 212 178 190 200 162 L 225 182 C 195 225 160 245 115 245 C 68 245 45 225 68 210 Z" 
            fill="url(#simboraSymbolGrad)"/>

      <!-- Seta indicadora de direção / Chegada (Penedo) -->
      <path d="M 160 26 L 222 18 L 214 80 L 192 58 L 152 98 L 130 76 L 170 36 Z" 
            fill="url(#arrowGrad)"/>
      <circle cx="214" cy="26" r="6" fill="#F8F9F6"/>
    </g>

    <!-- 2. WORDMARK: SIMBORA (Posicionado com alinhamento óptico) -->
    <g transform="translate(132, 10)">
      <!-- S -->
      <path d="M 38 24 C 38 13 29 10 20 10 C 10 10 3 14 2 22 C 1 31 10 34 19 37 C 29 40 40 43 40 54 C 40 65 30 70 19 70 C 8 70 1 65 0 55 L 10 53 C 11 59 15 62 19 62 C 24 62 29 59 29 53 C 29 47 22 45 14 41 C 5 38 -3 33 -2 23 C -1 13 8 2 21 2 C 34 2 48 10 49 24 Z" fill="#123D32"/>

      <!-- I -->
      <rect x="58" y="4" width="10" height="66" rx="5" fill="#123D32"/>
      <circle cx="63" cy="-4" r="5" fill="#FFCC45"/>

      <!-- M -->
      <path d="M 82 70 L 82 8 C 82 6 85 3 87 4 C 90 5 92 7 95 11 L 106 33 L 117 11 C 120 7 122 5 125 4 C 127 3 130 6 130 8 L 130 70 L 120 70 L 120 25 L 110 46 C 108 48 104 48 102 46 L 92 25 L 92 70 Z" fill="#123D32"/>

      <!-- B -->
      <path d="M 146 5 L 166 5 C 176 5 184 10 184 20 C 184 27 179 32 173 34 C 181 36 187 42 187 50 C 187 62 177 70 166 70 L 146 70 Z M 156 15 L 156 32 L 165 32 C 170 32 173 28 173 23 C 173 18 170 15 165 15 Z M 156 42 L 156 61 L 166 61 C 171 61 176 57 176 51 C 176 45 171 42 166 42 Z" fill="#123D32"/>

      <!-- O -->
      <path d="M 218 4 C 235 4 247 18 247 38 C 247 58 235 72 218 72 C 201 72 189 58 189 38 C 189 18 201 4 218 4 Z M 218 14 C 207 14 200 24 200 38 C 200 52 207 62 218 62 C 229 62 236 52 236 38 C 236 24 229 14 218 14 Z" fill="#123D32"/>

      <!-- R -->
      <path d="M 257 5 L 277 5 C 287 5 294 12 294 23 C 294 32 288 39 279 41 L 296 70 L 284 70 L 269 43 L 267 43 L 267 70 L 257 70 Z M 267 15 L 267 33 L 276 33 C 281 33 284 30 284 24 C 284 18 281 15 276 15 Z" fill="#123D32"/>

      <!-- A com acento cinético de aceleração -->
      <path d="M 317 4 L 327 4 L 346 70 L 335 70 L 331 54 L 314 54 L 310 70 L 299 70 Z M 316 44 L 328 44 L 322 21 Z" fill="#123D32"/>
      <polygon points="325,-3 337,-8 334,-12 322,-7" fill="#FFCC45"/>

      <!-- 3. SLOGAN OFICIAL -->
      <text x="3" y="94" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#16A572" letter-spacing="2.8">
        PEDIU. CHEGOU. SIMBORA!
      </text>

      <!-- Badge de Origem Regional -->
      <g transform="translate(290, 81)">
        <rect width="68" height="17" rx="5" fill="#123D32" fill-opacity="0.08"/>
        <text x="7" y="12" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="800" fill="#123D32" letter-spacing="1">
          ALAGOAS
        </text>
      </g>
    </g>
  </g>
</svg>
