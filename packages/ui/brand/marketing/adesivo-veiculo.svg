<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="100%" height="100%">
  <!-- Adesivo Veicular Conceitual para Portas e Para-brisa (Transparente/Contorno) -->
  <defs>
    <linearGradient id="stickGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#123D32"/>
      <stop offset="60%" stop-color="#16A572"/>
      <stop offset="100%" stop-color="#FFCC45"/>
    </linearGradient>
  </defs>

  <!-- Borda de corte e adesivo vinílico -->
  <rect x="10" y="10" width="780" height="280" rx="36" fill="#123D32" stroke="#16A572" stroke-width="4"/>

  <g transform="translate(60, 50)">
    <!-- Símbolo em Emblema -->
    <g transform="translate(0, 5) scale(0.7)">
      <rect width="280" height="280" rx="64" fill="#17211D" stroke="#16A572" stroke-width="3"/>
      <circle cx="68" cy="210" r="14" fill="#16A572"/>
      <circle cx="68" cy="210" r="6" fill="#F8F9F6"/>
      <path d="M 68 210 C 68 165 130 150 150 120 C 170 90 165 60 135 48 C 110 38 75 55 78 85 L 42 80 C 35 32 90 8 145 16 C 200 24 212 75 180 115 C 150 150 110 155 100 180 C 92 200 105 212 125 212 C 155 212 178 190 200 162 L 225 182 C 195 225 160 245 115 245 C 68 245 45 225 68 210 Z" fill="#16A572"/>
      <path d="M 160 26 L 222 18 L 214 80 L 192 58 L 152 98 L 130 76 L 170 36 Z" fill="#FFCC45"/>
      <circle cx="214" cy="26" r="6" fill="#123D32"/>
    </g>

    <!-- Wordmark & Informações do Veículo -->
    <g transform="translate(230, 25)">
      <text x="0" y="60" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="64" font-weight="900" fill="#F8F9F6" letter-spacing="6">
        SIMBORA
      </text>
      
      <text x="0" y="105" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="800" fill="#FFCC45" letter-spacing="3">
        VEÍCULO CADASTRADO & VERIFICADO
      </text>

      <text x="0" y="145" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#16A572" letter-spacing="2">
        PEDIU. CHEGOU. SIMBORA! • ALAGOAS
      </text>
    </g>

    <!-- QR Code Mockup no canto direito -->
    <g transform="translate(560, 25)">
      <rect width="110" height="110" rx="16" fill="#FFFFFF"/>
      <!-- QR Pattern simplificado -->
      <rect x="12" y="12" width="28" height="28" fill="#123D32"/>
      <rect x="18" y="18" width="16" height="16" fill="#FFFFFF"/>
      <rect x="70" y="12" width="28" height="28" fill="#123D32"/>
      <rect x="76" y="18" width="16" height="16" fill="#FFFFFF"/>
      <rect x="12" y="70" width="28" height="28" fill="#123D32"/>
      <rect x="18" y="76" width="16" height="16" fill="#FFFFFF"/>
      <rect x="48" y="20" width="14" height="14" fill="#123D32"/>
      <rect x="52" y="52" width="20" height="20" fill="#16A572"/>
      <rect x="75" y="75" width="18" height="18" fill="#123D32"/>
      <text x="55" y="132" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="800" fill="#F8F9F6">
        BAIXAR APP
      </text>
    </g>
  </g>
</svg>
