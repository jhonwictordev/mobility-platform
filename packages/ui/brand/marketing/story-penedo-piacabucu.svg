<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <!-- Template Story Instagram 1080x1920 -->
  <defs>
    <radialGradient id="storyBg" cx="50%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#1A5243"/>
      <stop offset="60%" stop-color="#123D32"/>
      <stop offset="100%" stop-color="#0B261F"/>
    </radialGradient>
    <linearGradient id="storyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFCC45"/>
    </linearGradient>
    <filter id="storyShad" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1080" height="1920" fill="url(#storyBg)"/>

  <!-- Geometric Contour of Rio São Francisco Valley -->
  <g opacity="0.1" stroke="#16A572" stroke-width="3" fill="none">
    <path d="M 0 300 Q 540 100 1080 400"/>
    <path d="M 0 600 Q 540 400 1080 700"/>
    <path d="M 0 900 Q 540 700 1080 1000"/>
    <path d="M 0 1200 Q 540 1000 1080 1300"/>
  </g>

  <!-- Top Brand Navigation in Story -->
  <g transform="translate(100, 160)">
    <!-- Small Brand Mark -->
    <rect width="52" height="52" rx="14" fill="#17211D" stroke="#16A572" stroke-width="2"/>
    <circle cx="16" cy="38" r="4" fill="#16A572"/>
    <path d="M 16 38 C 16 30 26 28 30 23 C 33 18 31 12 26 10 C 20 8 15 12 16 18 L 10 17 C 8 7 16 2 26 4 C 36 6 39 16 32 24 C 26 31 19 33 18 37 Z" fill="#16A572"/>
    <polygon points="26,6 36,4 34,14 31,11 25,16 21,12 28,8" fill="#FFCC45"/>

    <text x="68" y="36" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="900" fill="#F8F9F6" letter-spacing="3">
      SIMBORA
    </text>

    <!-- Regional Pill Right -->
    <g transform="translate(680, 8)">
      <rect width="200" height="36" rx="18" fill="#16A572" fill-opacity="0.25"/>
      <text x="100" y="23" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="800" fill="#FFCC45" letter-spacing="1.5">
        ALAGOAS
      </text>
    </g>
  </g>

  <!-- Main Headline Callout -->
  <g transform="translate(100, 360)">
    <text x="0" y="0" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="700" fill="#16A572" letter-spacing="3">
      CHEGOU O TRANSPORTE QUE PENEDO ESPERAVA
    </text>

    <text x="0" y="110" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="82" font-weight="900" fill="#F8F9F6" line-height="1.05">
      Simbora pra
    </text>
    <text x="0" y="200" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="82" font-weight="900" fill="#FFCC45">
      Penedo?
    </text>

    <!-- Secondary Punchy Line -->
    <g transform="translate(0, 270)">
      <rect width="640" height="64" rx="16" fill="#16A572" fill-opacity="0.2" stroke="#16A572" stroke-width="1.5"/>
      <text x="32" y="41" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="800" fill="#F8F9F6">
        De Piaçabuçu pra onde você quiser.
      </text>
    </g>
  </g>

  <!-- Interactive Graphic Route Card in Story -->
  <g transform="translate(100, 780)" filter="url(#storyShad)">
    <rect width="880" height="520" rx="40" fill="#17211D" stroke="#16A572" stroke-width="2.5"/>

    <!-- Map representation banner inside card -->
    <g transform="translate(40, 40)">
      <!-- Piaçabuçu Point -->
      <g transform="translate(0, 40)">
        <circle cx="36" cy="36" r="24" fill="#16A572"/>
        <text x="36" y="44" text-anchor="middle" font-size="20">🌊</text>
        <text x="80" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="26" font-weight="900" fill="#F8F9F6">
          Piaçabuçu (Foz do São Francisco)
        </text>
        <text x="80" y="60" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#16A572">
          Praça São Francisco de Borja • Peba
        </text>
      </g>

      <!-- Connecting High-Speed Route -->
      <line x1="36" y1="120" x2="36" y2="240" stroke="#FFCC45" stroke-width="6" stroke-dasharray="10,8"/>
      
      <!-- Distance Badge in Middle of Route -->
      <g transform="translate(70, 160)">
        <rect width="320" height="44" rx="22" fill="#123D32" stroke="#FFCC45" stroke-width="1.5"/>
        <text x="160" y="28" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFCC45">
          28 km • Rota Direta AL-101 / AL-225
        </text>
      </g>

      <!-- Penedo Point -->
      <g transform="translate(0, 260)">
        <circle cx="36" cy="36" r="24" fill="#FFCC45"/>
        <text x="36" y="44" text-anchor="middle" font-size="20">🏛️</text>
        <text x="80" y="32" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="26" font-weight="900" fill="#F8F9F6">
          Penedo (Centro Histórico)
        </text>
        <text x="80" y="60" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#FFCC45">
          Largo de São Gonçalo • Orla do Velho Chico
        </text>
      </g>

      <!-- Pricing / Category Bar in Card -->
      <g transform="translate(0, 360)">
        <rect width="800" height="60" rx="16" fill="#123D32"/>
        <text x="30" y="37" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="700" fill="#F8F9F6">
          Preço justo, sem susto no fim da viagem.
        </text>
        <text x="770" y="37" text-anchor="end" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="900" fill="#FFCC45">
          A partir de R$ 8,00
        </text>
      </g>
    </g>
  </g>

  <!-- Bottom CTA Swipe-Up Section -->
  <g transform="translate(540, 1580)" text-anchor="middle">
    <!-- Pulsing Arrow Up -->
    <path d="M -20 0 L 0 -20 L 20 0" fill="none" stroke="#FFCC45" stroke-width="4" stroke-linecap="round"/>
    <path d="M -20 18 L 0 -2 L 20 18" fill="none" stroke="#FFCC45" stroke-width="4" stroke-linecap="round" opacity="0.5"/>

    <text x="0" y="65" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="32" font-weight="900" fill="#F8F9F6" letter-spacing="2">
      ARRASTE PRA CIMA
    </text>

    <!-- Main Slogan -->
    <text x="0" y="115" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="24" font-weight="800" fill="#FFCC45" letter-spacing="3">
      PEDIU. CHEGOU. SIMBORA!
    </text>
    
    <text x="0" y="160" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#F8F9F6" fill-opacity="0.6">
      Disponível para Android e iOS
    </text>
  </g>
</svg>
