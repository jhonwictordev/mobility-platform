<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <radialGradient id="driverSplashBg" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1E2E28"/>
      <stop offset="60%" stop-color="#17211D"/>
      <stop offset="100%" stop-color="#0E1412"/>
    </radialGradient>

    <linearGradient id="driverGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#FFCC45"/>
    </linearGradient>

    <filter id="driverGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#FFCC45" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Dark Cockpit Base -->
  <rect width="1080" height="1920" fill="url(#driverSplashBg)"/>

  <!-- HUD Grid lines (Safe Driving Atmosphere) -->
  <g opacity="0.08" stroke="#FFCC45" stroke-width="1.5">
    <line x1="140" y1="0" x2="140" y2="1920"/>
    <line x1="940" y1="0" x2="940" y2="1920"/>
    <line x1="0" y1="400" x2="1080" y2="400"/>
    <line x1="0" y1="1500" x2="1080" y2="1500"/>
  </g>

  <!-- Center Driver Presentation -->
  <g transform="translate(540, 860)" text-anchor="middle">
    <!-- Driver Gold-Accented Emblem -->
    <g transform="translate(-140, -260) scale(1.0)" filter="url(#driverGlow)">
      <rect width="280" height="280" rx="64" fill="#123D32" stroke="#FFCC45" stroke-width="3"/>
      <circle cx="68" cy="210" r="14" fill="#16A572"/>
      <circle cx="68" cy="210" r="6" fill="#F8F9F6"/>
      <path d="M 68 210 C 68 165 130 150 150 120 C 170 90 165 60 135 48 C 110 38 75 55 78 85 L 42 80 C 35 32 90 8 145 16 C 200 24 212 75 180 115 C 150 150 110 155 100 180 C 92 200 105 212 125 212 C 155 212 178 190 200 162 L 225 182 C 195 225 160 245 115 245 C 68 245 45 225 68 210 Z" 
            fill="url(#driverGoldGrad)"/>
      <path d="M 160 26 L 222 18 L 214 80 L 192 58 L 152 98 L 130 76 L 170 36 Z" 
            fill="#FFFFFF"/>
      <circle cx="214" cy="26" r="6" fill="#123D32"/>
    </g>

    <!-- Wordmark -->
    <text x="0" y="110" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="60" font-weight="900" fill="#F8F9F6" letter-spacing="8">
      SIMBORA
    </text>

    <!-- Driver Sub-Brand Pill -->
    <g transform="translate(-120, 140)">
      <rect width="240" height="42" rx="21" fill="#FFCC45"/>
      <text x="120" y="27" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="900" fill="#123D32" letter-spacing="3">
        MOTORISTA
      </text>
    </g>

    <!-- Partner Value Proposition -->
    <text x="0" y="240" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="18" font-weight="600" fill="#16A572" letter-spacing="2">
      PARCERIA • AUTONOMIA • GANHOS DIÁRIOS
    </text>
  </g>

  <!-- Cockpit Live Status Badge -->
  <g transform="translate(540, 1720)" text-anchor="middle">
    <rect x="-150" y="-20" width="300" height="40" rx="20" fill="#123D32" stroke="#16A572" stroke-width="1.5"/>
    <circle cx="-110" cy="0" r="6" fill="#16A572"/>
    <text x="10" y="7" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="700" fill="#F8F9F6">
      SISTEMA PRONTO PARA CORRER
    </text>
  </g>
</svg>
