<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="100%" height="100%">
  <defs>
    <radialGradient id="splashBg" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1A5243"/>
      <stop offset="60%" stop-color="#123D32"/>
      <stop offset="100%" stop-color="#0B261F"/>
    </radialGradient>

    <linearGradient id="splashSymbolGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#16A572"/>
      <stop offset="50%" stop-color="#1CD291"/>
      <stop offset="100%" stop-color="#FFCC45"/>
    </linearGradient>

    <filter id="splashGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#16A572" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Deep Forest Background -->
  <rect width="1080" height="1920" fill="url(#splashBg)"/>

  <!-- Subtle Topographic Wave Lines (Alagoas Coast & River) -->
  <g opacity="0.12" stroke="#16A572" stroke-width="2.5" fill="none">
    <path d="M -100 600 Q 300 450 600 700 T 1200 600"/>
    <path d="M -100 800 Q 300 650 600 900 T 1200 800"/>
    <path d="M -100 1000 Q 300 850 600 1100 T 1200 1000"/>
    <path d="M -100 1200 Q 300 1050 600 1300 T 1200 1200"/>
  </g>

  <!-- Center Brand Presentation -->
  <g transform="translate(540, 880)" text-anchor="middle">
    <!-- Emblem -->
    <g transform="translate(-140, -260) scale(1.0)" filter="url(#splashGlow)">
      <rect width="280" height="280" rx="64" fill="#17211D" stroke="#16A572" stroke-width="3"/>
      <circle cx="68" cy="210" r="14" fill="#16A572"/>
      <circle cx="68" cy="210" r="6" fill="#F8F9F6"/>
      <path d="M 68 210 C 68 165 130 150 150 120 C 170 90 165 60 135 48 C 110 38 75 55 78 85 L 42 80 C 35 32 90 8 145 16 C 200 24 212 75 180 115 C 150 150 110 155 100 180 C 92 200 105 212 125 212 C 155 212 178 190 200 162 L 225 182 C 195 225 160 245 115 245 C 68 245 45 225 68 210 Z" 
            fill="url(#splashSymbolGrad)"/>
      <path d="M 160 26 L 222 18 L 214 80 L 192 58 L 152 98 L 130 76 L 170 36 Z" 
            fill="#FFCC45"/>
      <circle cx="214" cy="26" r="6" fill="#123D32"/>
    </g>

    <!-- Wordmark -->
    <text x="0" y="110" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="64" font-weight="900" fill="#F8F9F6" letter-spacing="8">
      SIMBORA
    </text>

    <!-- Slogan -->
    <text x="0" y="165" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="22" font-weight="700" fill="#16A572" letter-spacing="4">
      PEDIU. CHEGOU. SIMBORA!
    </text>

    <!-- Regional Subtitle -->
    <text x="0" y="215" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="600" fill="#FFCC45" letter-spacing="2">
      ALAGOAS • MOBILIDADE INTELIGENTE
    </text>
  </g>

  <!-- Footer Indicator -->
  <g transform="translate(540, 1750)" text-anchor="middle">
    <circle cx="-24" cy="0" r="5" fill="#16A572"/>
    <circle cx="0" cy="0" r="5" fill="#FFCC45"/>
    <circle cx="24" cy="0" r="5" fill="#16A572"/>
    <text x="0" y="50" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#F8F9F6" fill-opacity="0.4" letter-spacing="1">
      Penedo • Piaçabuçu • Litoral Sul
    </text>
  </g>
</svg>
