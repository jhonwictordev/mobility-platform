<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <!-- SIMBORA — INSTAGRAM STORY (1080x1920 - FORMATO 9:16) -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@800;900&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;family=JetBrains+Mono:wght@700&amp;display=swap');
      .story-tag { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 22px; font-weight: 800; fill: #123D32; letter-spacing: 2px; }
      .story-title { font-family: 'Manrope', sans-serif; font-size: 74px; font-weight: 900; fill: #F8F9F6; line-height: 1.15; }
      .story-pill { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 24px; font-weight: 700; fill: #FFFFFF; }
    </style>
    <linearGradient id="storyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#123D32"/>
      <stop offset="60%" stop-color="#164A3D"/>
      <stop offset="100%" stop-color="#17211D"/>
    </linearGradient>
  </defs>

  <!-- Fundo Gradiente Verde Profundo para Grafite -->
  <rect width="1080" height="1920" fill="url(#storyGrad)"/>

  <!-- Ondas Cinéticas Dinâmicas -->
  <path d="M -100 600 C 300 300, 700 900, 1180 500" fill="none" stroke="#16A572" stroke-width="12" opacity="0.3"/>
  <path d="M -100 850 C 300 550, 700 1150, 1180 750" fill="none" stroke="#FFCC45" stroke-width="6" opacity="0.25"/>

  <!-- HEADER STORY: LOGO SIMBORA -->
  <g transform="translate(100, 140)">
    <g transform="scale(0.8)">
      <path d="M 28 76 C 24 64, 30 52, 44 48 L 56 44 C 68 40, 76 32, 74 20" stroke="#F8F9F6" stroke-width="11" stroke-linecap="round" fill="none"/>
      <path d="M 72 24 C 62 14, 42 16, 32 26 C 22 36, 28 50, 48 54 C 68 58, 76 68, 68 80 C 60 90, 42 88, 30 80" stroke="#16A572" stroke-width="10" stroke-linecap="round" fill="none"/>
      <circle cx="72" cy="24" r="7.5" fill="#FFCC45"/>
    </g>
    <text x="95" y="44" font-family="'Manrope', sans-serif" font-size="36" font-weight="900" fill="#F8F9F6" letter-spacing="2">SIMBORA</text>
  </g>

  <!-- BADGE SUPERIOR -->
  <g transform="translate(100, 260)">
    <rect width="320" height="54" rx="27" fill="#FFCC45"/>
    <text x="160" y="36" class="story-tag" text-anchor="middle">BORAMOBILIDADE</text>
  </g>

  <!-- TÍTULO DE IMPACTO -->
  <g transform="translate(100, 400)">
    <text x="0" y="0" class="story-title">Precisa ir para</text>
    <text x="0" y="85" class="story-title">Piaçabuçu ou</text>
    <text x="0" y="170" class="story-title" fill="#FFCC45">Penedo hoje?</text>
  </g>

  <!-- CARD CENTRAL DE BENEFÍCIOS -->
  <g transform="translate(100, 680)">
    <!-- Benefício 1 -->
    <rect x="0" y="0" width="880" height="120" rx="24" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="60" cy="60" r="24" fill="#16A572"/>
    <text x="60" y="68" font-family="'Manrope', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle">✓</text>
    <text x="110" y="68" class="story-pill">Partidas pontuais a cada 30 minutos</text>

    <!-- Benefício 2 -->
    <rect x="0" y="150" width="880" height="120" rx="24" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="60" cy="210" r="24" fill="#16A572"/>
    <text x="60" y="218" font-family="'Manrope', sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle">✓</text>
    <text x="110" y="218" class="story-pill">Vans e carros climatizados com conforto</text>

    <!-- Benefício 3 -->
    <rect x="0" y="300" width="880" height="120" rx="24" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.1)"/>
    <circle cx="60" cy="360" r="24" fill="#FFCC45"/>
    <text x="60" y="368" font-family="'Manrope', sans-serif" font-size="24" font-weight="900" fill="#123D32" text-anchor="middle">★</text>
    <text x="110" y="368" class="story-pill" fill="#FFCC45">Tarifa fixa e transparente: R$ 15,00 no Pix</text>
  </g>

  <!-- SLOGAN DE ASSINATURA -->
  <g transform="translate(100, 1260)">
    <rect width="880" height="180" rx="30" fill="#123D32" stroke="#16A572" stroke-width="2"/>
    <text x="440" y="80" font-family="'Manrope', sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle">"Pediu. Chegou. Simbora!"</text>
    <text x="440" y="125" font-family="'Plus Jakarta Sans', sans-serif" font-size="22" font-weight="600" fill="#16A572" text-anchor="middle">Sem filas, sem estresse. Chame pelo app.</text>
  </g>

  <!-- ARRASTE PARA CIMA / LINK INTERATIVO -->
  <g transform="translate(540, 1680)">
    <circle cx="0" cy="0" r="38" fill="#16A572" filter="drop-shadow(0 8px 24px rgba(22,165,114,0.5))"/>
    <path d="M -12 6 L 0 -8 L 12 6" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round"/>
    <text x="0" y="70" font-family="'Manrope', sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle">ARRASTE PARA BAIXAR O APP</text>
  </g>
</svg>
