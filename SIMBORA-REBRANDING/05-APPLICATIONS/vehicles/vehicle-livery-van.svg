<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <!-- SIMBORA — ENVELOPAMENTO OFICIAL DE FROTA: VAN INTERMUNICIPAL -->
  <defs>
    <style>
      .van-body { fill: #F8F9F6; stroke: #CBD5E1; stroke-width: 2; }
      .van-window { fill: #17211D; opacity: 0.85; rx: 8; }
      .van-wheel { fill: #1E293B; stroke: #64748B; stroke-width: 6; }
      .van-hubcap { fill: #CBD5E1; }
      .van-label { font-family: 'Manrope', sans-serif; font-size: 15px; font-weight: 800; fill: #123D32; }
      .van-slogan { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 11px; font-weight: 700; fill: #16A572; letter-spacing: 1px; }
    </style>
  </defs>

  <rect width="1200" height="600" fill="#E2E8F0"/>

  <!-- TÍTULO DA PRANCHA TÉCNICA -->
  <text x="50" y="50" font-family="'Manrope', sans-serif" font-size="22" font-weight="900" fill="#123D32">ESPECIFICAÇÃO DE ENVELOPAMENTO VEICULAR — VAN INTERMUNICIPAL SIMBORA</text>
  <text x="50" y="75" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#64748B">Rota Homologada: Penedo ↔ Piaçabuçu • Aplicação em Vinil Automotivo Cast com Laminação UV</text>

  <!-- SILHUETA DA VAN (X: 100, Y: 120, W: 1000, H: 400) -->
  <g transform="translate(100, 120)">
    <!-- Chassi / Carroceria da Van -->
    <path d="M 50 260 L 50 140 C 50 110, 80 90, 140 90 L 760 90 C 820 90, 890 120, 930 180 L 960 230 C 970 245, 970 260, 970 280 L 970 300 L 50 300 Z" class="van-body"/>

    <!-- Pára-choque e Saia Inferior em Verde Profundo -->
    <path d="M 45 285 L 975 285 L 975 315 C 975 320, 965 325, 950 325 L 70 325 C 55 325, 45 320, 45 315 Z" fill="#123D32"/>

    <!-- Janelas Panorâmicas da Van -->
    <rect x="140" y="110" width="130" height="75" rx="8" class="van-window"/>
    <rect x="290" y="110" width="150" height="75" rx="8" class="van-window"/>
    <rect x="460" y="110" width="150" height="75" rx="8" class="van-window"/>
    <rect x="630" y="110" width="150" height="75" rx="8" class="van-window"/>
    <!-- Cabine / Pára-brisa dianteiro -->
    <path d="M 800 110 L 890 160 C 905 170, 905 185, 890 185 L 800 185 Z" class="van-window"/>

    <!-- GRAFISMO DINÂMICO THE KINETIC RIBBON ENVELOPADO NA LATERAL -->
    <g transform="translate(180, 80)">
      <!-- Faixa Gigante Verde Vibrante fluindo da traseira até a frente -->
      <path d="M 0 160 C 180 160, 320 220, 480 180 C 560 160, 680 130, 780 150" 
            fill="none" stroke="#16A572" stroke-width="36" stroke-linecap="round" opacity="0.95"/>
      <!-- Faixa de Contraponto Verde Profundo -->
      <path d="M 20 190 C 180 190, 320 250, 480 210 C 560 190, 680 160, 760 175" 
            fill="none" stroke="#123D32" stroke-width="22" stroke-linecap="round" opacity="0.9"/>
      <!-- Filete de Energia Solar Amarelo -->
      <path d="M 60 215 C 200 215, 340 270, 480 230 C 560 210, 660 190, 720 200" 
            fill="none" stroke="#FFCC45" stroke-width="8" stroke-linecap="round"/>
      
      <!-- Ponto Solar de Chegada -->
      <circle cx="780" cy="150" r="18" fill="#FFCC45"/>
    </g>

    <!-- LOGOTIPO SIMBORA APLICADO NA PORTA DIANTEIRA E LATERAL -->
    <g transform="translate(420, 115)">
      <rect width="360" height="90" rx="16" fill="rgba(248, 249, 246, 0.95)" stroke="#123D32" stroke-width="1.5"/>
      <g transform="translate(20, 10) scale(0.7)">
        <path d="M 28 76 C 24 64, 30 52, 44 48 L 56 44 C 68 40, 76 32, 74 20" stroke="#123D32" stroke-width="11" stroke-linecap="round" fill="none"/>
        <path d="M 72 24 C 62 14, 42 16, 32 26 C 22 36, 28 50, 48 54 C 68 58, 76 68, 68 80 C 60 90, 42 88, 30 80" stroke="#16A572" stroke-width="10" stroke-linecap="round" fill="none"/>
        <circle cx="72" cy="24" r="6" fill="#FFCC45"/>
      </g>
      <text x="90" y="48" font-family="'Manrope', sans-serif" font-size="30" font-weight="900" fill="#123D32" letter-spacing="1.5">SIMBORA</text>
      <text x="92" y="70" class="van-slogan">Pediu. Chegou. Simbora!</text>
    </g>

    <!-- IDENTIFICAÇÃO DE ROTA & NÚMERO DE FROTA -->
    <rect x="70" y="220" width="180" height="45" rx="8" fill="#123D32"/>
    <text x="160" y="248" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="800" fill="#FFCC45" text-anchor="middle">VAN #04 • PENEDO</text>

    <!-- CAIXAS DE RODA E RODAS DA VAN -->
    <circle cx="210" cy="300" r="60" class="van-wheel"/>
    <circle cx="210" cy="300" r="28" class="van-hubcap"/>
    <circle cx="210" cy="300" r="10" fill="#123D32"/>

    <circle cx="790" cy="300" r="60" class="van-wheel"/>
    <circle cx="790" cy="300" r="28" class="van-hubcap"/>
    <circle cx="790" cy="300" r="10" fill="#123D32"/>
  </g>

  <!-- NOTAS DE MEDIÇÃO / ESPECIFICAÇÃO TÉCNICA -->
  <g transform="translate(100, 520)">
    <text font-family="'JetBrains Mono', monospace" font-size="12" fill="#64748B">
      COMPRIMENTO DO GRAFISMO: 3.80m • ALTURA DO LOGO: 45cm • VINIL AVERY DENNISON MPI 1105 COM LAMINAÇÃO DOL 1360Z
    </text>
  </g>
</svg>
