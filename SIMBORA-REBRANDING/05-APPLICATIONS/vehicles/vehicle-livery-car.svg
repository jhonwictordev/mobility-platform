<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <!-- SIMBORA — ADESIVO OFICIAL PARA PORTA DE VEÍCULO PARCEIRO (60x60cm) -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@800;900&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      .car-badge-title { font-family: 'Manrope', sans-serif; font-size: 34px; font-weight: 900; fill: #123D32; letter-spacing: 2px; }
      .car-badge-sub { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 800; fill: #16A572; letter-spacing: 1.5px; }
      .car-badge-tag { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 800; fill: #123D32; letter-spacing: 1.5px; }
    </style>
  </defs>

  <rect width="600" height="600" fill="#E2E8F0"/>

  <!-- ADESIVO MAGNÉTICO OU VINIL COM BORDAS ARREDONDADAS (500x500 no centro) -->
  <g transform="translate(50, 50)">
    <rect width="500" height="500" rx="36" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" filter="drop-shadow(0 16px 36px rgba(0,0,0,0.15))"/>

    <!-- Faixa Superior em Verde Profundo -->
    <path d="M 0 36 C 0 16, 16 0, 36 0 L 464 0 C 484 0, 500 16, 500 36 L 500 120 L 0 120 Z" fill="#123D32"/>
    <text x="250" y="70" font-family="'Plus Jakarta Sans', sans-serif" font-size="20" font-weight="800" fill="#FFCC45" text-anchor="middle" letter-spacing="3">
      ★ VEÍCULO HOMOLOGADO
    </text>

    <!-- SÍMBOLO THE KINETIC RIBBON CENTRAL -->
    <g transform="translate(200, 150) scale(1.0)">
      <path d="M 28 76 C 24 64, 30 52, 44 48 L 56 44 C 68 40, 76 32, 74 20" stroke="#123D32" stroke-width="11" stroke-linecap="round" fill="none"/>
      <path d="M 72 24 C 62 14, 42 16, 32 26 C 22 36, 28 50, 48 54 C 68 58, 76 68, 68 80 C 60 90, 42 88, 30 80" stroke="#16A572" stroke-width="10" stroke-linecap="round" fill="none"/>
      <circle cx="72" cy="24" r="6" fill="#FFCC45"/>
      <circle cx="30" cy="80" r="5" fill="#123D32"/>
    </g>

    <!-- WORDMARK & SLOGAN -->
    <text x="250" y="290" class="car-badge-title" text-anchor="middle">SIMBORA</text>
    <text x="250" y="320" class="car-badge-sub" text-anchor="middle">Pediu. Chegou. Simbora!</text>

    <!-- QR CODE DE SEGURANÇA E IDENTIFICAÇÃO DO PASSAGEIRO -->
    <g transform="translate(195, 345)">
      <rect width="110" height="110" rx="12" fill="#F8F9F6" stroke="#123D32" stroke-width="2"/>
      <!-- QR Code Estilizado -->
      <rect x="15" y="15" width="25" height="25" fill="#123D32"/>
      <rect x="70" y="15" width="25" height="25" fill="#123D32"/>
      <rect x="15" y="70" width="25" height="25" fill="#123D32"/>
      <rect x="48" y="48" width="14" height="14" fill="#FFCC45"/>
      <circle cx="55" cy="55" r="3" fill="#16A572"/>
      <rect x="50" y="20" width="10" height="10" fill="#123D32"/>
      <rect x="20" y="50" width="10" height="10" fill="#123D32"/>
      <rect x="70" y="70" width="20" height="20" fill="#16A572"/>
    </g>

    <!-- BADGE INFERIOR -->
    <rect x="80" y="468" width="340" height="24" rx="12" fill="#16A572"/>
    <text x="250" y="484" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#FFFFFF" text-anchor="middle">ESCANEIE PARA CONFIRMAR SUA CORRIDA SEGURA</text>
  </g>
</svg>
