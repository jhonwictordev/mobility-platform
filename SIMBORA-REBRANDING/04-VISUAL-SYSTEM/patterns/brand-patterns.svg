<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- SIMBORA — PADRÕES GRÁFICOS E TEXTURAS VISUAIS OFICIAIS -->
  <defs>
    <!-- PADRÃO 1: KINETIC TRANSIT WAVES (ONDAS FLUIDAS DE TRAJETÓRIA) -->
    <pattern id="kineticWavePattern" width="200" height="150" patternUnits="userSpaceOnUse">
      <path d="M 0 50 C 50 10, 100 90, 150 50 C 180 25, 200 40, 220 50" 
            fill="none" stroke="#16A572" stroke-width="4" stroke-opacity="0.35"/>
      <path d="M 0 90 C 60 40, 120 120, 180 80 C 200 65, 220 75, 240 85" 
            fill="none" stroke="#123D32" stroke-width="3" stroke-opacity="0.25"/>
      <circle cx="150" cy="50" r="3" fill="#FFCC45" opacity="0.6"/>
    </pattern>

    <!-- PADRÃO 2: MODULAR CONNECTION GRID (GRID DE CONEXÃO URBANA) -->
    <pattern id="connectionGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#16A572" stroke-width="0.75" stroke-opacity="0.15"/>
      <circle cx="0" cy="0" r="2" fill="#123D32" opacity="0.4"/>
      <circle cx="60" cy="60" r="2" fill="#16A572" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- PAINEL 1: TEXTURA KINETIC WAVE (APLICAÇÃO EM FUNDO VERDE PROFUNDO) -->
  <rect x="20" y="20" width="360" height="260" rx="16" fill="#123D32"/>
  <rect x="20" y="20" width="360" height="260" rx="16" fill="url(#kineticWavePattern)"/>
  <text x="40" y="255" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#F8F9F6" letter-spacing="1">PADRÃO A: KINETIC FLOW (FROTA &amp; MARKETING)</text>

  <!-- PAINEL 2: TEXTURA MODULAR GRID (APLICAÇÃO EM FUNDO CLARO) -->
  <rect x="420" y="20" width="360" height="260" rx="16" fill="#F8F9F6" stroke="#E2E8F0"/>
  <rect x="420" y="20" width="360" height="260" rx="16" fill="url(#connectionGrid)"/>
  <!-- Grafismo com Fita Flutuante Central -->
  <g transform="translate(480, 70) scale(1.6)">
    <path d="M 28 76 C 24 64, 30 52, 44 48 L 56 44 C 68 40, 76 32, 74 20" stroke="#123D32" stroke-width="7" stroke-linecap="round" fill="none"/>
    <path d="M 72 24 C 62 14, 42 16, 32 26 C 22 36, 28 50, 48 54 C 68 58, 76 68, 68 80 C 60 90, 42 88, 30 80" stroke="#16A572" stroke-width="6.5" stroke-linecap="round" fill="none"/>
    <circle cx="72" cy="24" r="4.5" fill="#FFCC45"/>
  </g>
  <text x="440" y="255" font-family="'Manrope', sans-serif" font-size="12" font-weight="700" fill="#123D32" letter-spacing="1">PADRÃO B: MODULAR CONNECTION (DIGITAL UI)</text>

  <!-- PAINEL 3: FAIXA DECORATIVA PANORÂMICA (RODAPÉ DE APLICAÇÕES FÍSICAS) -->
  <rect x="20" y="310" width="760" height="260" rx="16" fill="#17211D"/>
  <g transform="translate(40, 340)">
    <!-- Linhas de Fluxo Dinâmico Contínuo -->
    <path d="M 0 80 Q 180 10, 360 80 T 720 80" fill="none" stroke="#16A572" stroke-width="6" opacity="0.8"/>
    <path d="M 0 110 Q 180 40, 360 110 T 720 110" fill="none" stroke="#123D32" stroke-width="12" opacity="0.9"/>
    <path d="M 0 140 Q 180 70, 360 140 T 720 140" fill="none" stroke="#FFCC45" stroke-width="3" opacity="0.85"/>

    <circle cx="360" cy="80" r="12" fill="#FFCC45"/>
    <circle cx="360" cy="80" r="6" fill="#17211D"/>

    <text x="20" y="195" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#F8F9F6" letter-spacing="1.5">SISTEMA DINÂMICO DE ENVELOPAMENTO VEICULAR &amp; CRIAÇÃO PUBLICITÁRIA</text>
  </g>
</svg>
