<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- SIMBORA — CONJUNTO DE ICONOGRAFIA OFICIAL (DESIGN SYSTEM) -->
  <defs>
    <style>
      .icon-label { font-family: 'Manrope', sans-serif; font-size: 11px; font-weight: 700; fill: #64748B; text-anchor: middle; }
      .icon-title { font-family: 'Manrope', sans-serif; font-size: 18px; font-weight: 800; fill: #123D32; }
      .icon-card { fill: #F8F9F6; stroke: #E2E8F0; stroke-width: 1; rx: 14; }
    </style>
  </defs>

  <rect width="800" height="450" fill="#FFFFFF"/>

  <!-- TÍTULO -->
  <text x="40" y="45" class="icon-title">ICONOGRAFIA PROPRIETÁRIA SIMBORA (GRID 24x24 / TRAÇO 2.0px)</text>

  <!-- 1. CARRO URBANO -->
  <g transform="translate(40, 80)">
    <rect width="80" height="80" class="icon-card"/>
    <g transform="translate(16, 16)" fill="none" stroke="#123D32" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 6 18 L 8 8 C 9 6, 11 5, 14 5 L 34 5 C 37 5, 39 6, 40 8 L 42 18"/>
      <rect x="4" y="18" width="40" height="18" rx="4"/>
      <circle cx="12" cy="36" r="4" fill="#16A572" stroke="none"/>
      <circle cx="36" cy="36" r="4" fill="#16A572" stroke="none"/>
      <line x1="10" y1="24" x2="16" y2="24" stroke="#FFCC45" stroke-width="2.5"/>
      <line x1="32" y1="24" x2="38" y2="24" stroke="#FFCC45" stroke-width="2.5"/>
    </g>
    <text x="40" y="105" class="icon-label">Simbora Urbano</text>
  </g>

  <!-- 2. VAN INTERMUNICIPAL -->
  <g transform="translate(135, 80)">
    <rect width="80" height="80" class="icon-card"/>
    <g transform="translate(16, 16)" fill="none" stroke="#123D32" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="4" y="6" width="40" height="28" rx="4"/>
      <line x1="4" y1="18" x2="44" y2="18"/>
      <line x1="18" y1="6" x2="18" y2="18"/>
      <line x1="30" y1="6" x2="30" y2="18"/>
      <circle cx="12" cy="34" r="4" fill="#16A572" stroke="none"/>
      <circle cx="36" cy="34" r="4" fill="#16A572" stroke="none"/>
      <circle cx="40" cy="24" r="2" fill="#FFCC45" stroke="none"/>
    </g>
    <text x="40" y="105" class="icon-label">Intermunicipal</text>
  </g>

  <!-- 3. PONTO DE PARTIDA -->
  <g transform="translate(230, 80)">
    <rect width="80" height="80" class="icon-card"/>
    <g transform="translate(16, 16)" fill="none" stroke="#16A572" stroke-width="2.2" stroke-linecap="round">
      <circle cx="24" cy="24" r="16" stroke="#16A572" stroke-dasharray="3,3"/>
      <circle cx="24" cy="24" r="7" fill="#16A572"/>
      <circle cx="24" cy="24" r="2.5" fill="#F8F9F6"/>
    </g>
    <text x="40" y="105" class="icon-label">Origem / GPS</text>
  </g>

  <!-- 4. PONTO SOLAR DE CHEGADA -->
  <g transform="translate(325, 80)">
    <rect width="80" height="80" class="icon-card"/>
    <g transform="translate(16, 16)" fill="none" stroke-linecap="round">
      <path d="M 24 6 C 15 6, 8 13, 8 22 C 8 32, 24 44, 24 44 C 24 44, 40 32, 40 22 C 40 13, 33 6, 24 6 Z" 
            fill="#123D32" stroke="#123D32" stroke-width="2"/>
      <circle cx="24" cy="20" r="6" fill="#FFCC45"/>
    </g>
    <text x="40" y="105" class="icon-label">Destino Final</text>
  </g>

  <!-- 5. ESCUDO DE SEGURANÇA -->
  <g transform="translate(420, 80)">
    <rect width="80" height="80" class="icon-card"/>
    <g transform="translate(16, 16)" fill="none" stroke="#123D32" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 24 6 L 40 12 C 40 28, 30 38, 24 42 C 18 38, 8 28, 8 12 Z" fill="#DCFCE7"/>
      <path d="M 16 22 L 22 28 L 32 18" stroke="#166534" stroke-width="3"/>
    </g>
    <text x="40" y="105" class="icon-label">Segurança 24h</text>
  </g>

  <!-- 6. PAGAMENTO TRANSPARENTE -->
  <g transform="translate(515, 80)">
    <rect width="80" height="80" class="icon-card"/>
    <g transform="translate(16, 16)" fill="none" stroke="#123D32" stroke-width="2.2" stroke-linecap="round">
      <rect x="6" y="10" width="36" height="26" rx="4"/>
      <line x1="6" y1="18" x2="42" y2="18" stroke="#16A572" stroke-width="3"/>
      <circle cx="14" cy="28" r="3" fill="#FFCC45" stroke="none"/>
    </g>
    <text x="40" y="105" class="icon-label">Pix &amp; Cartão</text>
  </g>

  <!-- 7. ESTIMATIVA DE TEMPO -->
  <g transform="translate(610, 80)">
    <rect width="80" height="80" class="icon-card"/>
    <g transform="translate(16, 16)" fill="none" stroke="#123D32" stroke-width="2.2" stroke-linecap="round">
      <circle cx="24" cy="24" r="18"/>
      <polyline points="24,12 24,24 32,28" stroke="#16A572" stroke-width="2.8"/>
      <circle cx="24" cy="24" r="2.5" fill="#FFCC45"/>
    </g>
    <text x="40" y="105" class="icon-label">Previsão Ágil</text>
  </g>

  <!-- 8. MOTORISTA PARCEIRO -->
  <g transform="translate(705, 80)">
    <rect width="80" height="80" class="icon-card"/>
    <g transform="translate(16, 16)" fill="none" stroke="#123D32" stroke-width="2.2" stroke-linecap="round">
      <circle cx="24" cy="16" r="9"/>
      <path d="M 8 40 C 8 30, 16 26, 24 26 C 32 26, 40 30, 40 40"/>
      <circle cx="34" cy="14" r="4.5" fill="#FFCC45" stroke="none"/>
    </g>
    <text x="40" y="105" class="icon-label">Motorista 5★</text>
  </g>

  <!-- FAIXA INFERIOR COM AMOSTRA DE ESTILO DE COMPONENTES -->
  <rect x="40" y="230" width="720" height="180" rx="16" fill="#123D32"/>
  <g transform="translate(70, 260)">
    <text font-family="'Manrope', sans-serif" font-size="16" font-weight="800" fill="#FFFFFF">PRINCÍPIOS DA ICONOGRAFIA SIMBORA</text>
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#94A3B8" y="24">1. Ângulos de Curvatura Suaves • 2. Traço Único de 2.2px • 3. Acentos de Cor Solar nos Pontos Ativos</text>

    <!-- Exemplo de Card de Corrida Integrado com Ícones -->
    <rect x="0" y="45" width="660" height="70" rx="10" fill="#17211D" stroke="#16A572" stroke-width="1"/>
    <circle cx="40" cy="80" r="18" fill="#16A572"/>
    <circle cx="40" cy="80" r="8" fill="#FFCC45"/>
    <text x="75" y="75" font-family="'Manrope', sans-serif" font-size="14" font-weight="800" fill="#FFFFFF">Simbora Intermunicipal: Penedo → Piaçabuçu</text>
    <text x="75" y="95" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#CBD5E1">Partida Prevista: 14h20 • Van Confort Climatizada • 28 km</text>
    <text x="540" y="85" font-family="'JetBrains Mono', monospace" font-size="17" font-weight="800" fill="#FFCC45">R$ 15,00</text>
  </g>
</svg>
