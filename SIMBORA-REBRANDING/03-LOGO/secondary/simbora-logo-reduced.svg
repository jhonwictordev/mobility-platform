    <circle cx="72" cy="24" r="8" fill="#FFCC45"/>
    <circle cx="30" cy="80" r="7" fill="#123D32"/>
  </g>

  <!-- Wordmark robusto -->
  <text x="68" y="42" class="logo-compact-title">SIMBORA</text>
  <circle cx="230" cy="34" r="3.5" fill="#FFCC45"/>
</svg>
