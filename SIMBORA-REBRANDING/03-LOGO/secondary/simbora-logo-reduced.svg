<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="100%" height="100%">
  <!-- SIMBORA — LOGO VERSÃO REDUZIDA (COMPACT / DISPLAY DIGITAL) -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@900&amp;display=swap');
      .logo-compact-title {
        font-family: 'Manrope', -apple-system, system-ui, sans-serif;
        font-size: 34px;
        font-weight: 900;
        letter-spacing: 2px;
        fill: #123D32;
      }
    </style>
  </defs>

  <!-- Símbolo com traço robusto compensado para redução -->
  <g transform="translate(8, 7) scale(0.48)">
    <path d="M 28 76 C 24 64, 30 52, 44 48 L 56 44 C 68 40, 76 32, 74 20" 
          stroke="#123D32" stroke-width="14" stroke-linecap="round" fill="none"/>
    <path d="M 72 24 C 62 14, 42 16, 32 26 C 22 36, 28 50, 48 54 C 68 58, 76 68, 68 80 C 60 90, 42 88, 30 80" 
