    <clipPath id="appIconRadiusB">
      <rect x="0" y="0" width="512" height="512" rx="115"/>
    </clipPath>
  </defs>

  <!-- Container Base -->
  <rect width="512" height="512" rx="115" fill="#123D32"/>

