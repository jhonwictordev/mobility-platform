<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 110" width="100%" height="100%">
  <!-- SIMBORA CONCEPT C — LOGOTIPO PRINCIPAL HORIZONTAL (Brasilidade Contemporânea) -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&amp;display=swap');
      .brand-title-c {
        font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-size: 47px;
        font-weight: 900;
        letter-spacing: 2.2px;
        fill: #123D32;
      }
      .brand-slogan-c {
        font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: 1.5px;
        fill: #16A572;
      }
    </style>
  </defs>

  <!-- SÍMBOLO CONCEITO C (X: 15, Y: 15, W: 80, H: 80) -->
  <g transform="translate(15, 15)">
    <!-- Sol Central de Partida Amarelo Energia -->
    <circle cx="40" cy="40" r="10.5" fill="#FFCC45"/>

    <!-- Asa Superior Expansiva Verde Vibrante -->
    <path d="M 40 16 C 54 16, 65 27, 65 40 C 65 45, 63 50, 59 54" 
          stroke="#16A572" stroke-width="8.8" stroke-linecap="round" fill="none"/>

    <!-- Asa Inferior de Acolhimento Verde Profundo -->
    <path d="M 40 64 C 26 64, 15 53, 15 40 C 15 35, 17 30, 21 26" 
          stroke="#123D32" stroke-width="8.8" stroke-linecap="round" fill="none"/>

    <circle cx="59" cy="54" r="4" fill="#16A572"/>
    <circle cx="21" cy="26" r="4" fill="#123D32"/>
  </g>

  <!-- WORDMARK & SLOGAN -->
  <text x="115" y="60" class="brand-title-c">SIMBORA</text>
  <text x="117" y="85" class="brand-slogan-c">Pediu. Chegou. Simbora!</text>

  <!-- ASSINATURA SOLAR -->
  <circle cx="415" cy="50" r="6" fill="#FFCC45"/>
</svg>
