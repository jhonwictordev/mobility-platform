<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- SIMBORA APP ICON — CONCEITO A: MINIMALISMO TECNOLÓGICO -->
  <defs>
    <clipPath id="appIconRadius">
      <rect x="0" y="0" width="512" height="512" rx="115"/>
    </clipPath>
  </defs>

  <!-- Container Base com cantos arredondados (padrão iOS / Android Adaptive) -->
  <rect width="512" height="512" rx="115" fill="#123D32"/>

  <!-- Símbolo Escalado e Centralizado (Tamanho 300x300 dentro de 512x512, Margem 106px) -->
  <g transform="translate(106, 106) scale(3)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Traço Superior Verde Vibrante -->
    <path d="M 68 22 C 48 22, 30 32, 30 46 C 30 52, 34 56, 42 58" 
          stroke="#16A572" stroke-width="12"/>
    
    <!-- Traço Inferior Branco Suave para Máximo Contraste Noturno/Diurno -->
    <path d="M 32 78 C 52 78, 70 68, 70 54 C 70 48, 66 44, 58 42" 
          stroke="#F8F9F6" stroke-width="12"/>
    
    <!-- Ponto Central Solar Amarelo Energia -->
    <circle cx="50" cy="50" r="7.5" fill="#FFCC45"/>
    <circle cx="68" cy="22" r="6" fill="#16A572"/>
    <circle cx="32" cy="78" r="6" fill="#F8F9F6"/>
  </g>
</svg>
