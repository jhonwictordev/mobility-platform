<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 110" width="100%" height="100%">
  <!-- SIMBORA CONCEPT B — LOGOTIPO PRINCIPAL HORIZONTAL (Movimento e Conexão) -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;display=swap');
      .brand-title-b {
        font-family: 'Manrope', system-ui, -apple-system, sans-serif;
        font-size: 45px;
        font-weight: 800;
        letter-spacing: 1.5px;
        fill: #123D32;
      }
      .brand-slogan-b {
        font-family: 'Manrope', system-ui, -apple-system, sans-serif;
        font-size: 13.5px;
        font-weight: 600;
        letter-spacing: 1.2px;
        fill: #16A572;
      }
    </style>
  </defs>

  <!-- SÍMBOLO CONCEITO B (X: 15, Y: 15, W: 80, H: 80) -->
  <g transform="translate(15, 15)">
    <!-- Camada de Conexão Inferior -->
    <path d="M 22 61 C 19 51, 24 42, 35 38 L 45 35 C 54 32, 61 26, 59 16" 
          stroke="#123D32" stroke-width="8.5" stroke-linecap="round" fill="none"/>
    
    <!-- Camada Dinâmica Frontal Verde Vibrante -->
    <path d="M 58 19 C 50 11, 34 13, 26 21 C 18 29, 22 40, 38 43 C 54 46, 61 54, 54 64 C 48 72, 34 70, 24 64" 
          stroke="#16A572" stroke-width="8" stroke-linecap="round" fill="none"/>

    <!-- Ponto Focal de Chegada Amarelo Energia -->
    <circle cx="58" cy="19" r="4.8" fill="#FFCC45"/>
    <circle cx="24" cy="64" r="4" fill="#123D32"/>
  </g>

  <!-- WORDMARK & SLOGAN -->
  <text x="115" y="60" class="brand-title-b">SIMBORA</text>
  <text x="117" y="85" class="brand-slogan-b">Pediu. Chegou. Simbora!</text>

  <!-- ACENTO DE CONEXÃO -->
  <path d="M 405 45 C 415 45, 425 55, 420 65" stroke="#FFCC45" stroke-width="4" stroke-linecap="round" fill="none"/>
</svg>
