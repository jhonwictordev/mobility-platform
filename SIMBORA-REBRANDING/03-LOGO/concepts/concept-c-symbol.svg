<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- SIMBORA CONCEPT C: THE SOLAR RHYTHM (Marca Brasileira Contemporânea) -->
  <!-- Ritmo modernista brasileiro (Athos Bulcão & Burle Marx): Arcos esculturais concêntricos integrados ao núcleo solar pulsante -->
  <g id="Symbol-Concept-C" fill="none">
    <!-- Sol Central de Partida e Energia (Amarelo Ouro Solar) -->
    <circle cx="50" cy="50" r="13" fill="#FFCC45"/>

    <!-- Asa Superior Expansiva (Verde Vibrante - Movimento Norte / Destino) -->
    <path d="M 50 20 C 68 20, 82 34, 82 50 C 82 56, 80 62, 75 67" 
          stroke="#16A572" stroke-width="11" stroke-linecap="round"/>

    <!-- Asa Inferior de Acolhimento e Base (Verde Profundo - Solidez e Raiz) -->
    <path d="M 50 80 C 32 80, 18 66, 18 50 C 18 44, 20 38, 25 33" 
          stroke="#123D32" stroke-width="11" stroke-linecap="round"/>

    <!-- Micro-satélites de Ritmo Tropical -->
    <circle cx="75" cy="67" r="5" fill="#16A572"/>
    <circle cx="25" cy="33" r="5" fill="#123D32"/>
  </g>
</svg>
