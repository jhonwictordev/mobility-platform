<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <!-- SIMBORA CONCEPT A: THE DYNAMIC MONOGRAM (Minimalismo Tecnológico) -->
  <!-- Construção em Grid Suíço 100x100: Dois arcos modulares opostos e tangentes com corte em 45 graus e ponto de dados solar -->
  <defs>
    <clipPath id="clipA">
      <rect width="100" height="100" rx="0"/>
    </clipPath>
  </defs>
  <g id="Symbol-Concept-A" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Base de precisão geométrica: Trajetória Superior (Origem ao Centro) -->
    <path d="M 68 22 C 48 22, 30 32, 30 46 C 30 52, 34 56, 42 58" 
          stroke="#16A572" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Trajetória Inferior (Centro ao Destino) - Tangência perfeita -->
    <path d="M 32 78 C 52 78, 70 68, 70 54 C 70 48, 66 44, 58 42" 
          stroke="#123D32" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Núcleo de Conexão Central e Tensão Óptica em 45° -->
    <circle cx="50" cy="50" r="7" fill="#FFCC45"/>
    
    <!-- Micro-acento de partida na haste superior -->
    <circle cx="68" cy="22" r="6" fill="#16A572"/>
    <!-- Micro-acento de ancoragem na haste inferior -->
    <circle cx="32" cy="78" r="6" fill="#123D32"/>
  </g>
</svg>
