<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- SIMBORA APP ICON — CONCEITO C: MARCA BRASILEIRA CONTEMPORÂNEA -->
  <defs>
    <clipPath id="appIconRadiusC">
      <rect x="0" y="0" width="512" height="512" rx="115"/>
    </clipPath>
  </defs>

  <!-- Container Base Verde Profundo -->
  <rect width="512" height="512" rx="115" fill="#123D32"/>

  <!-- Símbolo Solar Escalado e Centralizado (Tamanho ~300x300, Offset: 106, 106) -->
  <g transform="translate(106, 106) scale(3)" fill="none">
    <!-- Sol Central de Partida e Energia Amarelo Ouro Solar -->
    <circle cx="50" cy="50" r="14" fill="#FFCC45"/>

    <!-- Asa Superior Expansiva Verde Vibrante -->
    <path d="M 50 20 C 68 20, 82 34, 82 50 C 82 56, 80 62, 75 67" 
          stroke="#16A572" stroke-width="11" stroke-linecap="round"/>

    <!-- Asa Inferior de Acolhimento Branco Suave para Máxima Luminosidade Noturna -->
    <path d="M 50 80 C 32 80, 18 66, 18 50 C 18 44, 20 38, 25 33" 
          stroke="#F8F9F6" stroke-width="11" stroke-linecap="round"/>

    <!-- Micro-satélites de Ritmo -->
    <circle cx="75" cy="67" r="5.5" fill="#16A572"/>
    <circle cx="25" cy="33" r="5.5" fill="#F8F9F6"/>
  </g>
</svg>
