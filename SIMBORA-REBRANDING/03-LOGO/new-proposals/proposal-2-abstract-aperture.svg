<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 200" width="100%" height="100%">
  <!-- PROPOSTA 2: SÍMBOLO ABSTRATO INDEPENDENTE ("THE QUADRANT APERTURE") -->
  <!-- 4 quadrantes geométricos sólidos convergindo em um portal central de trânsito solar -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@800;900&amp;family=Plus+Jakarta+Sans:wght@700&amp;display=swap');
      .p2-title { font-family: 'Manrope', sans-serif; font-size: 52px; font-weight: 900; letter-spacing: 2px; fill: #123D32; }
      .p2-slogan { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13.5px; font-weight: 700; letter-spacing: 2px; fill: #16A572; text-transform: uppercase; }
    </style>
  </defs>

  <rect width="650" height="200" fill="#FFFFFF"/>

  <!-- SÍMBOLO ABSTRATO (X: 35, Y: 35, W: 130, H: 130) -->
  <g transform="translate(35, 35)">
    <!-- Quadrante Superior Esquerdo (Verde Profundo) -->
    <path d="M 10 10 L 55 10 C 55 35, 35 55, 10 55 Z" fill="#123D32"/>
    
    <!-- Quadrante Superior Direito (Verde Vibrante - Movimento) -->
    <path d="M 65 10 L 110 10 L 110 55 C 85 55, 65 35, 65 10 Z" fill="#16A572"/>
    
    <!-- Quadrante Inferior Esquerdo (Verde Vibrante) -->
    <path d="M 10 65 C 35 65, 55 85, 55 110 L 10 110 Z" fill="#16A572"/>
    
    <!-- Quadrante Inferior Direito (Verde Profundo - Base) -->
    <path d="M 110 65 L 110 110 L 65 110 C 65 85, 85 65, 110 65 Z" fill="#123D32"/>

    <!-- Núcleo Central de Conexão Solar (Amarelo Energia) -->
    <circle cx="60" cy="60" r="14" fill="#FFCC45"/>
    <circle cx="60" cy="60" r="6" fill="#FFFFFF"/>
  </g>

  <!-- WORDMARK & SLOGAN -->
  <text x="195" y="105" class="p2-title">SIMBORA</text>
  <text x="198" y="138" class="p2-slogan">Pediu. Chegou. Simbora!</text>
</svg>
