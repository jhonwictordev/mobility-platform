<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 200" width="100%" height="100%">
  <!-- PROPOSTA 6: CONCEITO EXPERIMENTAL BRASILEIRO CONTEMPORÂNEO ("O AZULEJO MODERNISTA") -->
  <!-- Inspirado no Concretismo Brasileiro, Athos Bulcão, Alexandre Wollner e Cobogós arquitetônicos -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      .p6-title {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 50px;
        font-weight: 800;
        letter-spacing: 5px;
        fill: #123D32;
      }
      .p6-slogan {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        fill: #16A572;
      }
    </style>
  </defs>

  <rect width="700" height="200" fill="#FFFFFF"/>

  <!-- SÍMBOLO: O AZULEJO MODERNISTA (ATHOS & WOLLNER) -->
  <g transform="translate(60, 45)">
    <!-- Base Moldura Suave do Azulejo -->
    <rect x="0" y="0" width="110" height="110" rx="16" fill="#F8F9F6"/>

    <!-- Quadrante Superior Esquerdo: Arco Concreto (Verde Profundo) -->
    <path d="M 12 12 H 55 V 55 A 43 43 0 0 1 12 12 Z" fill="#123D32"/>

    <!-- Quadrante Inferior Direito: Arco Concreto Inverso (Verde Vibrante) -->
    <path d="M 98 98 H 55 V 55 A 43 43 0 0 1 98 98 Z" fill="#16A572"/>

    <!-- Quadrante Superior Direito: Cunha Angular (Verde Vibrante) -->
    <path d="M 55 12 L 98 12 L 98 55 Z" fill="#16A572" opacity="0.9"/>

    <!-- Quadrante Inferior Esquerdo: Cunha Angular (Verde Profundo) -->
    <path d="M 55 98 L 12 98 L 12 55 Z" fill="#123D32" opacity="0.9"/>

    <!-- Ponto Focal Central: O Sol Nordestino (Amarelo Energia) -->
    <circle cx="55" cy="55" r="16" fill="#FFCC45"/>
    <circle cx="55" cy="55" r="6" fill="#123D32"/>
  </g>

  <!-- TIPOGRAFIA E SLOGAN -->
  <g transform="translate(230, 108)">
    <text x="0" y="0" class="p6-title">SIMBORA</text>
    <text x="4" y="32" class="p6-slogan">Pediu. Chegou. Simbora!</text>
  </g>
</svg>
