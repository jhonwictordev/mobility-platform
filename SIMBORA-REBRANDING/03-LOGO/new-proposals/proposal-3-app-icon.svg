<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- PROPOSTA 3: APP ICON (THE ARCHITECTURAL MONOGRAM) -->
  <defs>
    <clipPath id="p3Radius">
      <rect width="512" height="512" rx="115"/>
    </clipPath>
  </defs>

  <rect width="512" height="512" rx="115" fill="#123D32"/>

  <!-- Monograma Arquitetônico Escalado (Escala 3.0x, Offset: 80, 80) -->
