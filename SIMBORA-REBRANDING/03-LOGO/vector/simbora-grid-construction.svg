<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <!-- SIMBORA — DIAGRAMA TÉCNICO DE CONSTRUÇÃO GEOMÉTRICA & GRID (MÜLLER-BROCKMANN SYSTEM) -->
  <defs>
    <pattern id="smallGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#23352E" stroke-width="0.8"/>
    </pattern>
    <pattern id="majorGrid" width="100" height="100" patternUnits="userSpaceOnUse">
      <rect width="100" height="100" fill="url(#smallGrid)"/>
      <path d="M 100 0 L 0 0 0 100" fill="none" stroke="#2F4F42" stroke-width="1.5"/>
    </pattern>
    <style>
      .guide-line { stroke: #38BDF8; stroke-dasharray: 4,4; stroke-width: 1; opacity: 0.7; }
      .circle-guide { stroke: #FFCC45; stroke-dasharray: 3,3; stroke-width: 1; fill: none; opacity: 0.6; }
      .tangent-line { stroke: #F43F5E; stroke-dasharray: 2,2; stroke-width: 1.2; }
      .measure-text { font-family: 'JetBrains Mono', monospace; font-size: 11px; fill: #94A3B8; font-weight: 600; }
    </style>
  </defs>

  <!-- Fundo Técnico Cinza-Grafite Profundo -->
  <rect width="500" height="500" fill="#0F1714"/>
  <rect width="500" height="500" fill="url(#majorGrid)"/>

  <!-- EIXOS COORDENADOS PRINCIPAIS -->
  <line x1="250" y1="20" x2="250" y2="480" stroke="#16A572" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="20" y1="250" x2="480" y2="250" stroke="#16A572" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- DIRETRIZES DE RAIO E TANGÊNCIA -->
  <!-- Círculo de tangência superior R1 -->
  <circle cx="340" cy="170" r="110" class="circle-guide"/>
  <!-- Círculo de tangência inferior R2 -->
  <circle cx="160" cy="330" r="110" class="circle-guide"/>

  <!-- LINHAS TANGENCIAIS EM 45 GRAUS -->
  <line x1="100" y1="400" x2="400" y2="100" class="tangent-line"/>

  <!-- SÍMBOLO REFINADO EM ESCALA (Centro 250, 250) -->
  <g transform="translate(100, 100) scale(3)" fill="none">
    <!-- Base Estrutural Verde Profundo -->
    <path d="M 28 76 C 24 64, 30 52, 44 48 L 56 44 C 68 40, 76 32, 74 20" 
          stroke="#16A572" stroke-width="11" stroke-linecap="round"/>
    
    <!-- Fita Frontal Verde Vibrante -->
    <path d="M 72 24 C 62 14, 42 16, 32 26 C 22 36, 28 50, 48 54 C 68 58, 76 68, 68 80 C 60 90, 42 88, 30 80" 
          stroke="#F8F9F6" stroke-width="10" stroke-linecap="round"/>

    <!-- Ponto Solar Amarelo -->
    <circle cx="72" cy="24" r="6" fill="#FFCC45"/>
    <circle cx="30" cy="80" r="5" fill="#16A572"/>
  </g>

  <!-- COTAS E NOTAÇÕES TÉCNICAS -->
  <text x="30" y="45" class="measure-text">GRID: 20x20px MÓDULOS</text>
  <text x="30" y="65" class="measure-text">PROPORÇÃO ÁUREA: 1 : 1.618</text>
  <text x="340" y="60" class="measure-text" fill="#FFCC45">VÉRTICE SOLAR (X: 316, Y: 172)</text>
  <text x="30" y="465" class="measure-text">RAIO R1 = R2 = 55u</text>
  <text x="280" y="465" class="measure-text">TANGÊNCIA CENTRAL: 45.0°</text>
</svg>
