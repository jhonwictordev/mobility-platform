<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="100%" height="100%">
  <!-- SIMBORA — LOGOTIPO OFICIAL HORIZONTAL (FUNDO ESCURO) -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@700;800;900&amp;display=swap');
      .logo-brand-title-dark {
        font-family: 'Manrope', -apple-system, system-ui, sans-serif;
        font-size: 44px;
        font-weight: 900;
        letter-spacing: 2.2px;
        fill: #F8F9F6;
      }
      .logo-brand-slogan-dark {
        font-family: 'Manrope', -apple-system, system-ui, sans-serif;
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: 1.4px;
        fill: #FFCC45;
      }
    </style>
  </defs>

  <!-- SÍMBOLO REFINADO: THE KINETIC RIBBON (VERSÃO ESCURA) -->
  <g transform="translate(16, 15)">
    <!-- Base Estrutural em Branco Suave para Máximo Contraste Noturno -->
    <path d="M 24 64 C 20 54, 25 44, 38 40 L 48 37 C 58 34, 65 27, 63 16" 
          stroke="#F8F9F6" stroke-width="9" stroke-linecap="round" fill="none"/>
    
    <!-- Fita Dinâmica em Verde Vibrante -->
    <path d="M 62 18 C 53 9, 36 11, 28 20 C 19 29, 23 41, 41 45 C 58 48, 66 57, 58 68 C 51 77, 36 75, 25 68" 
          stroke="#16A572" stroke-width="8.5" stroke-linecap="round" fill="none"/>

    <!-- Ponto Solar de Chegada Amarelo Energia -->
    <circle cx="62" cy="18" r="5.2" fill="#FFCC45"/>
    <circle cx="25" cy="68" r="4.2" fill="#F8F9F6"/>
  </g>

  <!-- WORDMARK SIMBORA BRANCO SUAVE -->
  <text x="120" y="60" class="logo-brand-title-dark">SIMBORA</text>
  
  <!-- SLOGAN OFICIAL AMARELO ENERGIA -->
  <text x="122" y="85" class="logo-brand-slogan-dark">Pediu. Chegou. Simbora!</text>

  <!-- ACENTO DINÂMICO -->
  <circle cx="430" cy="50" r="4.5" fill="#16A572"/>
</svg>
