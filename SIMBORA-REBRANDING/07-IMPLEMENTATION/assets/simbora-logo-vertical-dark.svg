<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 280" width="100%" height="100%">
  <!-- SIMBORA — ASSINATURA VERTICAL OFICIAL (FUNDO ESCURO) -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@700;800;900&amp;display=swap');
      .logo-vd-title {
        font-family: 'Manrope', -apple-system, system-ui, sans-serif;
        font-size: 38px;
        font-weight: 900;
        letter-spacing: 2px;
        fill: #F8F9F6;
        text-anchor: middle;
      }
      .logo-vd-slogan {
        font-family: 'Manrope', -apple-system, system-ui, sans-serif;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1.2px;
        fill: #FFCC45;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- SÍMBOLO CENTRALIZADO NO TOPO -->
  <g transform="translate(80, 25)">
    <!-- Base Estrutural em Branco Suave -->
    <path d="M 28 76 C 24 64, 30 52, 44 48 L 56 44 C 68 40, 76 32, 74 20" 
          stroke="#F8F9F6" stroke-width="11" stroke-linecap="round" fill="none"/>
    
    <!-- Fita Dinâmica Verde Vibrante -->
    <path d="M 72 24 C 62 14, 42 16, 32 26 C 22 36, 28 50, 48 54 C 68 58, 76 68, 68 80 C 60 90, 42 88, 30 80" 
          stroke="#16A572" stroke-width="10" stroke-linecap="round" fill="none"/>

    <!-- Ponto Solar Amarelo Energia -->
    <circle cx="72" cy="24" r="6" fill="#FFCC45"/>
    <circle cx="30" cy="80" r="5" fill="#F8F9F6"/>
  </g>

  <!-- WORDMARK CENTRALIZADO BRANCO SUAVE -->
  <text x="130" y="190" class="logo-vd-title">SIMBORA</text>

  <!-- SLOGAN CENTRALIZADO AMARELO ENERGIA -->
  <text x="130" y="220" class="logo-vd-slogan">Pediu. Chegou. Simbora!</text>

  <!-- PONTO DE EQUILÍBRIO BASE -->
  <circle cx="130" cy="245" r="3.5" fill="#16A572"/>
</svg>
