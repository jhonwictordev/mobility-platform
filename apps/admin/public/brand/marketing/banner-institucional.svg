<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <!-- Banner Institucional 1200x630 -->
  <defs>
    <radialGradient id="banBg" cx="30%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#1A5243"/>
      <stop offset="60%" stop-color="#123D32"/>
      <stop offset="100%" stop-color="#0B261F"/>
    </radialGradient>
    <linearGradient id="banGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16A572"/>
      <stop offset="100%" stop-color="#FFCC45"/>
    </linearGradient>
    <filter id="banDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#051410" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#banBg)"/>

  <!-- Topographic Curvature Lines (Rio São Francisco / Rodovia AL-101) -->
  <g opacity="0.12" stroke="#16A572" stroke-width="2" fill="none">
    <path d="M 400 -50 Q 800 200 1250 150"/>
    <path d="M 450 -50 Q 850 250 1250 200"/>
    <path d="M 500 -50 Q 900 300 1250 250"/>
    <path d="M 550 -50 Q 950 350 1250 300"/>
  </g>

  <!-- Left Copy Column -->
  <g transform="translate(100, 140)">
    <!-- Regional Launch Pill -->
    <g transform="translate(0, 0)">
      <rect width="250" height="34" rx="17" fill="#16A572" fill-opacity="0.2" stroke="#16A572" stroke-width="1.2"/>
      <circle cx="20" cy="17" r="5" fill="#FFCC45"/>
      <text x="36" y="22" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="800" fill="#F8F9F6" letter-spacing="1.5">
        LANÇAMENTO EM ALAGOAS
      </text>
    </g>

    <!-- Main Headline -->
    <text x="0" y="110" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="54" font-weight="900" fill="#F8F9F6" line-height="1.1">
      Seu destino começa
    </text>
    <text x="0" y="175" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="54" font-weight="900" fill="#FFCC45">
      com SIMBORA.
    </text>

    <!-- Value Prop Subtitle -->
    <text x="0" y="235" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="500" fill="#F8F9F6" fill-opacity="0.85">
      Mobilidade urbana e viagens intermunicipais com segurança,
    </text>
    <text x="0" y="265" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="20" font-weight="500" fill="#F8F9F6" fill-opacity="0.85">
      agilidade e o calor da nossa gente em Penedo e Piaçabuçu.
    </text>

    <!-- CTA & Slogan -->
    <g transform="translate(0, 310)">
      <rect width="230" height="54" rx="27" fill="#16A572"/>
      <text x="115" y="33" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" letter-spacing="1">
        BAIXE O APP AGORA
      </text>

      <text x="260" y="34" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="700" fill="#FFCC45" letter-spacing="1.5">
        Pediu. Chegou. Simbora!
      </text>
    </g>
  </g>

  <!-- Right App Mockup Preview Card -->
  <g transform="translate(780, 110)" filter="url(#banDrop)">
    <!-- Phone Mockup Container -->
    <rect width="320" height="420" rx="36" fill="#17211D" stroke="#16A572" stroke-width="2"/>

    <!-- App Header in Mockup -->
    <g transform="translate(24, 28)">
      <rect width="36" height="36" rx="10" fill="#123D32"/>
      <path d="M 12 28 C 12 22 20 20 22 17 C 24 14 23 10 19 8 C 16 7 13 8 13 12 L 8 11 C 7 4 14 0 21 1 C 27 2 29 8 25 13 C 21 17 17 18 16 21 C 15 24 17 25 19 25 C 23 25 26 22 29 19 L 32 21 C 28 27 23 29 18 29 C 11 29 9 26 12 28 Z" fill="#16A572"/>
      <polygon points="19,3 26,2 25,9 22,6 18,10 15,7 20,4" fill="#FFCC45"/>
      <text x="46" y="24" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="16" font-weight="900" fill="#F8F9F6" letter-spacing="1">
        SIMBORA
      </text>
    </g>

    <!-- Route Card Preview in Phone -->
    <g transform="translate(24, 85)">
      <rect width="272" height="135" rx="16" fill="#123D32" stroke="#16A572" stroke-width="0.8"/>
      
      <!-- Piaçabuçu Point -->
      <circle cx="24" cy="35" r="7" fill="#16A572"/>
      <text x="40" y="39" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#F8F9F6">
        Piaçabuçu • Centro (Foz)
      </text>

      <!-- Connecting dotted route -->
      <line x1="24" y1="45" x2="24" y2="75" stroke="#FFCC45" stroke-width="2" stroke-dasharray="3,3"/>

      <!-- Penedo Point -->
      <circle cx="24" cy="85" r="7" fill="#FFCC45"/>
      <text x="40" y="89" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="700" fill="#F8F9F6">
        Penedo • Centro Histórico
      </text>

      <!-- Distance and ETA -->
      <rect x="20" y="105" width="232" height="20" rx="4" fill="#17211D"/>
      <text x="136" y="119" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10" font-weight="700" fill="#FFCC45">
        28.4 km • 28 min via AL-101
      </text>
    </g>

    <!-- Driver Card in Phone -->
    <g transform="translate(24, 235)">
      <rect width="272" height="90" rx="16" fill="#1E2E28"/>
      <circle cx="40" cy="45" r="22" fill="#16A572"/>
      <text x="40" y="52" text-anchor="middle" font-size="20">🚗</text>
      <text x="74" y="38" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="800" fill="#F8F9F6">
        Motorista a caminho
      </text>
      <text x="74" y="55" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="500" fill="#16A572">
        Toyota Corolla • Placa BRA2E19
      </text>
      <text x="74" y="70" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFCC45">
        ⭐ 4.9 (340 corridas)
      </text>
    </g>

    <!-- Bottom Status Bar -->
    <g transform="translate(24, 345)">
      <rect width="272" height="46" rx="12" fill="#16A572"/>
      <text x="136" y="28" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="13" font-weight="800" fill="#FFFFFF">
        ACOMPANHAR VIAGEM
      </text>
    </g>
  </g>
</svg>
