    <path d="M 98 81 L 98 10 C 98 7 101 4 104 5 C 107 6 110 9 113 13 L 126 38 L 139 13 C 142 9 145 6 148 5 C 151 4 154 7 154 10 L 154 81 L 143 81 L 143 30 L 131 53 C 129 56 123 56 121 53 L 109 30 L 109 81 Z" fill="#123D32"/>

