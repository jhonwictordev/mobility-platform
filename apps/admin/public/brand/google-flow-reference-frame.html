<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1920px;
    height: 1080px;
    background-color: #123D32;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
  }

  /* Subtle background radial ambient glow */
  .bg-glow {
    position: absolute;
    width: 900px;
    height: 900px;
    background: radial-gradient(circle, rgba(22, 165, 114, 0.18) 0%, rgba(18, 61, 50, 0) 70%);
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
  }

  .logo-container {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 48px;
  }

  .icon-box {
    width: 220px;
    height: 220px;
    border-radius: 54px;
    background: #0D2D25;
    border: 2.5px solid rgba(22, 165, 114, 0.4);
    box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45), 0 0 40px rgba(22, 165, 114, 0.2);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .icon-box svg {
    width: 100%;
    height: 100%;
  }

  .text-group {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .brand-name {
    font-size: 110px;
    font-weight: 900;
    color: #F8F9F6;
    letter-spacing: 5px;
    line-height: 1;
    text-shadow: 0 10px 30px rgba(0,0,0,0.3);
  }

  .brand-name span {
    color: #FFCC45;
    text-shadow: 0 0 30px rgba(255, 204, 69, 0.4);
  }

  .slogan {
    font-size: 24px;
    font-weight: 800;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #16A572;
    margin-top: 18px;
    text-shadow: 0 4px 15px rgba(0,0,0,0.25);
  }
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="logo-container">
    <div class="icon-box">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- SIMBORA APP ICON — STENCIL SPEED CUT -->
  <rect width="512" height="512" rx="112" fill="#123D32"/>
  <g transform="translate(100, 85) skewX(-12)">
    <!-- Asa Superior S (Branco Suave #F8F9F6) -->
    <path d="M 188 28 L 138 28 C 130 16, 116 10, 94 10 C 58 10, 36 30, 36 60 C 36 86, 56 102, 102 114 L 140 126 L 40 162 C 15 146, 0 120, 0 70 C 0 22, 42 0, 100 0 C 158 0, 186 24, 188 28 Z" fill="#F8F9F6"/>
    <!-- Asa Inferior S (Verde Vibrante #16A572) com rasgo de velocidade -->
    <path d="M 198 214 C 198 284, 150 326, 88 326 C 34 326, 2 292, 0 236 L 56 230 C 58 262, 74 278, 96 278 C 122 278, 142 260, 142 228 C 142 200, 124 186, 78 172 L 68 168 L 168 132 C 188 152, 198 180, 198 214 Z" fill="#16A572"/>
    <!-- Exclamação Solar (Amarelo Energia #FFCC45) -->
    <polygon points="238,8 288,8 274,212 248,212" fill="#FFCC45"/>
    <circle cx="260" cy="282" r="28" fill="#FFCC45"/>
  </g>
</svg>
    </div>
    <div class="text-group">
      <div class="brand-name">SIMBORA<span>!</span></div>
      <div class="slogan">Pediu. Chegou. Simbora!</div>
    </div>
  </div>
</body>
</html>
