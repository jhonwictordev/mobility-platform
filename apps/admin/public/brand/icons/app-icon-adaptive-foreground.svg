<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 432" width="100%" height="100%">
  <!-- Android Adaptive Icon Foreground (Transparent Background, Symbol in Center 66dp Safe Area) -->
  <defs>
    <linearGradient id="adapFlowGrad" x1="10%" y1="90%" x2="90%" y2="10%">
      <stop offset="0%" stop-color="#16A572"/>
      <stop offset="45%" stop-color="#1CD291"/>
      <stop offset="100%" stop-color="#FFCC45"/>
    </linearGradient>

    <linearGradient id="adapSolarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <filter id="adapShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#051410" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#adapShadow)" transform="translate(86, 86) scale(0.92)">
    <!-- Origin Waypoint -->
    <circle cx="70" cy="215" r="18" fill="#16A572"/>
    <circle cx="70" cy="215" r="8" fill="#F8F9F6"/>

    <!-- Dynamic Flow S Track -->
    <path d="M 70 215 C 70 165 135 150 155 120 C 175 90 170 55 138 42 C 108 30 70 50 74 85 L 32 80 C 24 25 85 -2 145 7 C 205 16 220 72 185 116 C 152 154 110 160 98 186 C 88 208 102 222 124 222 C 158 222 184 198 208 168 L 236 190 C 202 238 162 260 114 260 C 62 260 38 238 70 215 Z" 
          fill="url(#adapFlowGrad)"/>

    <!-- Kinetic Arrow -->
    <path d="M 166 22 L 235 14 L 226 82 L 202 58 L 158 102 L 134 78 L 178 34 Z" 
          fill="url(#adapSolarGrad)"/>

    <!-- Destination GPS Beacon Pulse -->
    <circle cx="226" cy="22" r="8" fill="#FFFFFF"/>
  </g>
</svg>
